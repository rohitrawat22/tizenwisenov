name: wiseplayertizen
description: "A Tizen-compatible Flutter project."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: '>=3.13.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components & Styling
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  google_fonts: ^7.0.0
  carousel_slider: ^5.1.1
  font_awesome_flutter: ^11.0.0
  lottie: ^3.3.2

  # Networking & HTTP
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  dio_smart_retry: ^7.0.1
  flutter_inappwebview: ^6.1.5
  cached_network_image: ^4.0.0

  # State Management & Architecture
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^17.0.1
  flutter_dotenv: ^5.1.0

  # Localization & Utilities
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  crypto: ^3.0.7
  qr_flutter: ^4.1.0
  open_filex: ^4.7.0
  device_preview: ^1.3.1
  fluttertoast: ^10.0.0

  # Video Player (emulator-compatible)
  better_player_plus: ^1.0.0        # Android/iOS only, not used on Tizen
  video_player: ^2.14.0             # API used by your Dart code
  video_player_tizen: any           # Tizen implementation (required)
  # video_player_avplay: any        # real Samsung TV only; breaks emulator build

  # Core Plugins with valid Tizen support
  url_launcher: ^6.3.2
  url_launcher_tizen: ^2.1.5

  path_provider: ^2.1.4
  path_provider_tizen: ^2.3.2

  device_info_plus: ^12.3.0
  device_info_plus_tizen: ^1.4.0

  connectivity_plus: ^7.0.0
  connectivity_plus_tizen: ^1.3.3

  shared_preferences: ^2.5.4
  shared_preferences_tizen: ^2.3.5

  flutter_secure_storage: ^10.3.1
  flutter_secure_storage_tizen: ^0.1.4

  geolocator: ^14.0.2
  geolocator_tizen: ^1.0.9

  wakelock_plus: ^1.2.0
  wakelock_plus_tizen: ^2.1.5

  package_info_plus_tizen: ^1.0.0
  sqflite_tizen: ^0.1.0
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/final_logo_animation_black_bg.json